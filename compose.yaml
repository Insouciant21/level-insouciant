name: ${COMPOSE_PROJECT_NAME:-level-insouciant}

x-runtime-environment: &runtime-environment
  DATABASE_HOST_OVERRIDE: postgresql
  DATABASE_NAME_OVERRIDE: level-insouciant

services:
  migrate:
    image: level-insouciant-migrate:local
    build:
      context: .
      target: migrate
    env_file:
      - .env
    environment: *runtime-environment
    networks:
      - 1panel-network
    restart: "no"

  web:
    image: ${BLOG_IMAGE:-level-insouciant:local}
    container_name: ${BLOG_CONTAINER_NAME:-level-insouciant-web}
    build:
      context: .
      target: runner
      network: host
    env_file:
      - .env
    environment:
      <<: *runtime-environment
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${SITE_URL:-http://localhost:21544}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - 1panel-network
    ports:
      - "127.0.0.1:${BLOG_HTTP_PORT:-21544}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

networks:
  1panel-network:
    external: true
    name: 1panel-network
